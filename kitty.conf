# vim:fileencoding=utf-8:foldmethod=marker

# Theme {{{
# Aura Dracula Spirit (Soft) — unified with tmux + nvim
# (previous theme kept in current-theme.conf: Base2Tone Lavender Dark)
# BEGIN_KITTY_THEME
include aura-theme.conf
# END_KITTY_THEME
# }}}

# Fonts {{{
font_size 12.0
# Uncomment and set your preferred font:
# font_family      JetBrains Mono
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
# }}}

# Clipboard & Selection {{{
# This is what fixes your copy issue
clipboard_control write-clipboard write-primary read-clipboard read-primary
copy_on_select clipboard
# }}}

# Keyboard shortcuts {{{
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0

# Scrolling with arrow keys
map shift+up         scroll_line_up
map shift+down       scroll_line_down
map shift+page_up    scroll_page_up
map shift+page_down  scroll_page_down
map shift+home       scroll_home
map shift+end        scroll_end
# }}}

# Nvim integration {{{
# Enable remote control (used by nvim plugins like vim-kitty-navigator)
allow_remote_control yes
listen_on unix:/tmp/kitty

# Proper terminal type for full feature support in nvim
term xterm-kitty

# Shell integration
shell_integration enabled

# Don't confirm window close (avoids prompt when closing nvim splits)
confirm_os_window_close 0
# }}}

# Tmux integration {{{
# Kitty is the renderer; tmux owns splits/tabs/sessions.
# Uncomment to auto-attach to (or create) a tmux session named "main"
# on every new kitty window:
# shell tmux new-session -A -s main
# }}}

# Scrollback {{{
scrollback_lines 10000
# }}}

# Window / Layout {{{
window_padding_width 4
enabled_layouts splits,stack
# }}}

# Performance {{{
repaint_delay 10
input_delay 3
sync_to_monitor yes
# }}}
